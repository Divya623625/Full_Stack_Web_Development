<!-- 
Anchor Element in HTML
The anchor element is used to create hyperlinks (links) in HTML.
It is created using the <a> tag.

Syntax -
<a href="URL">Link Text</a>

Example -
<a href="https://www.google.com">Visit Google</a>

Here -
<a> → anchor tag
href → attribute that stores the link address
Visit Google → clickable text

Open Link in New Tab
<a href="https://www.google.com" target="_blank">
  Open Google
</a>
target="_blank" opens the link in a new tab.

Absolute Links -
An absolute link contains the complete web address (full URL).
Example -
<a href="https://www.google.com">
  Google
</a>

Here -
https://www.google.com is the full website address.

Relative Links -
A relative link points to a file or page within the same website/project.
Example -
<a href="about.html">
  About Page
</a>

Here -
about.html is a page inside the same project folder.

Difference
Absolute Link	              |     Relative Link
Full URL is used	          |    File path is used
Used for external websites	  |     Used for internal pages
Example: https://google.com	  |    Example: about.html 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in HTML</title>
</head>
<body>
    <a href = "https://www.google.com" target="_blank">Google</a>
    <a href = "https://www.netflix.com/in/" target="_blank">Netflix</a>
</body>
</html>
