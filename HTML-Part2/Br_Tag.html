<!-- 
The <br> tag in HTML is used to insert a line break.

Example -
<p>Hello<br>World</p>

Output -
Hello
World

Key Points -
<br> is an empty/self-closing tag (it does not need a closing tag).
Used when you want text to continue on the next line without starting a new paragraph.

<b> Tag (Bold Tag)
Used to make text bold.
Makes the text darker and thicker.

<i> Tag (Italic Tag)
Used to make text italic.
Text appears slightly tilted.

<u> Tag (Underline Tag)
Used to make text underlined.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in Html</title>
</head>
<body>
    <p><h1><b>Morning Nature</b></h1>
    <i> The sun rises softly in the <u>sky</u>, <br>
        Spreading golden <u>light</u> up high. <br>
        Birds sing sweetly in the <u>trees</u>, <br>
        Dancing gently with the <u>breeze</u>. <br>

        Flowers bloom so fresh and <u>bright</u>, <br>
        Filling the air with pure delight. <br>
        Every morning brings new hope, <br>
        Helping every heart to cope.</i> <br>
    </p>
</body>
</html>
