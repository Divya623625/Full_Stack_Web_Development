<hr> Tag in HTML -
The <hr> tag stands for Horizontal Rule.
It is used to create a horizontal line on a webpage.
The <hr> tag is an empty tag, which means it does not need a closing tag.

Syntax -
<hr>

HTML Entities
HTML entities are special codes used to display -
Reserved characters
Symbols
Emojis
Extra spaces

=> Some characters cannot be written directly in HTML because browsers 
may misunderstand them as HTML tags.
=> HTML entities start with & and end with ;

Syntax -
&entity_name;
or
&#entity_number;

Common HTML Entities
Entity	Output	Meaning
&lt;	<	    Less than
&gt;	>	    Greater than
&amp;	&	    Ampersand
&quot;	"	    Double quotes
&nbsp;	Space	Non-breaking space
&hearts;	♥	Heart symbol
&copy;	    ©	Copyright symbol

Example of HTML Entities
<p>5 &lt; 10</p>
<p>I &hearts; HTML</p>
<p>&copy; 2026 Divya P</p>

Output -
5 < 10
I ♥ HTML
© 2026 Divya P
