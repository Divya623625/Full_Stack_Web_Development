<!-- 
The <img> tag is used to add images in HTML.

Syntax -
<img src="image.jpg" alt="Image">

Important Attributes
src → path of the image
alt → alternate text if image does not load
width → image width
height → image height

Example
<img src="nature.jpg" alt="Nature Image" width="300" height="200">

Output -
Displays the image named nature.jpg on the webpage. 

If you copy the image address from the internet, it is usually an Absolute Link 
because it contains the full website address.

Example -
<img src="https://example.com/image.jpg">
https://example.com/image.jpg → Absolute Link
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image in HTML</title>
</head>
<body>
    <img src = "nature.jpg" alt = "ironman image" height = "400px" width = "600px">
    <img src = "flower_img.jpeg" alt = "Flower image" height = "400px" width = "600px">
    <img src = "https://cdn.pixabay.com/photo/2023/08/18/15/02/dog-8198719_1280.jpg" alt = "Dog image" height = "400px" width = "400px">
</body>
</html>
