<!-- HTML is not case sensitive.
Example -
<h1> Hello </h1>
<H1> Hello </H1>
Both work the same. 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case sensitive in HTML</title>
</head>
<body>
    <h1>This is a heading 1</h1>
    <H1>This is a heading 1</H1>
    <p>This is a paragraph!!!</p>
    <P>This is a paragraph!!!</P>
</body>
</html>
