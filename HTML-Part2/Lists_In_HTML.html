<!-- 
Lists in HTML are used to display a group of related items in an organized way.

Unordered List in HTML
An unordered list is used to display items with bullet points.
It is created using the <ul> tag and each item is written inside the <li> tag.
<ul>
  <li>Apple</li>
  <li>Banana</li>
  <li>Mango</li>
</ul>

Ordered List in HTML
An ordered list is used to display items in a specific order using numbers or letters.
It is created using the <ol> tag and each item is written inside the <li> tag.

<ol>
  <li> HTML </li>
  <li> CSS </li>
  <li> JavaScript </li>
</ol>

Types -
1 → 1, 2, 3
A → A, B, C
a → a, b, c
I → I, II, III
i → i, ii, iii
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lists in HTML </title>
</head>
<body>
    <ul>
        <li>Bread</li>
        <li>Jam</li>
        <li>Frooti</li>
        <li>Samosa</li>
        <li>Dosa</li>
    </ul>

    <ol type = "a">
        <li>Bread</li>
        <li>Jam</li>
        <li>Frooti</li>
        <li>Samosa</li>
        <li>Dosa</li>
    </ol>
</body>
</html>
