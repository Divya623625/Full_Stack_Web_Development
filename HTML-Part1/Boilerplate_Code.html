<!--
HTML Boilerplate Code

<!DOCTYPE html> is a declaration that tells the browser:
"This document is an HTML5 document."

<html> - The <html> tag is called the root tag or root element in HTML.
. It contains all HTML code.

<head> - The <head> element contains information about the webpage.
. It contains the metadata of the webpage.

<title> My First Page </title> - Shown on the browser tab.

<body> - The <body> element contains the visible content of the webpage.

<p>Hello World</p>

</body>
</html>
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Boilerplate Code</title>
    </head>
    <body>
        <p> Hello World !!! </p>
    </body>
</html>
