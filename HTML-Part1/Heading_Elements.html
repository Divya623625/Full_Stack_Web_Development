<!-- 
Heading Elements - HTML heading elements are used to give titles and headings in a webpage.
. The <h1> to <h6> HTML elements represent six levels of section headings.
. <h1> is the highest section level and <h6> is the lowest.

There are 6 heading elements -
<h1> Heading 1 </h1>
<h2> Heading 2 </h2>
<h3> Heading 3 </h3>
<h4> Heading 4 </h4>
<h5> Heading 5 </h5>
<h6> Heading 6 </h6>

<h1> → biggest heading
<h6> → smallest heading
-->
