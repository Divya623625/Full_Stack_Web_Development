<!-- 
HTML Elements -
An HTML element is a complete structure consisting of -
. opening tag
. content
. closing tag
Paragraph - <p> Paragraph </p>
Heading - <h1> Heading 1 <h1>
Images - <img>
The component used to design the structure of websites are called as HTML tags.

HTML Tags -
An HTML tag is a keyword enclosed in angle brackets <> used to define HTML elements.
<p> This is a paragraph </p>
|   |_________________|   |
|       Content           |
|_________________________|
        Element

Here <p> is called an opening tag.
</p> is called a closing tag.
-->
