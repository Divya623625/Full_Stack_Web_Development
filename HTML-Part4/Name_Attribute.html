<!-- 
In HTML forms, the name attribute is used to give an input field a name/identifier.
When the form is submitted, the browser sends data in this format:
name=value

Example -
<form>
    <input type="text" name="username">
</form>

If the user types-
Divya
then the form sends-
username=Divya

Here-
username → name attribute
Divya → value entered by user

Example with password-
<input type="password" name="password">
Data sent-
password=1234 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms In HTML</title>
</head>
<body>
    <form action="/server">
        <div>
            <label for="username">Username : </label>
            <input type="text" placeholder="Enter username" id="username" name="username">
        </div>
        <div>
            <label for="password">Password : </label>
            <input type="password" placeholder="Enter password" id="password" name="password">
        </div>
        <button>Submit</button>
    </form>
    <hr>
    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="Search in youtube" name="search_query">
        <button>Search</button>
    </form>
</body>
</html>
