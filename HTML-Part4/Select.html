<!-- <select> is used to create a dropdown list in HTML.
Example -
<select name="city">
    <option value="bangalore">Bangalore</option>
    <option value="mumbai">Mumbai</option>
    <option value="delhi">Delhi</option>
</select>
If user selects Mumbai, form sends:
city=mumbai
Here -
<select> → creates dropdown
<option> → items inside dropdown
name → field name
value → data sent after selection 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select</title>
</head>
<body>
    <form action="/server">
        <div>
            Choose your profession
            <select name="profession" id="profession">
                <option>Select your option</option>
                <option value="stu">Student</option>
                <option value="dev" selected>Developer</option>
            </select>
        </div>
        <button>Submit</button>
    </form>
</body>
</html>
