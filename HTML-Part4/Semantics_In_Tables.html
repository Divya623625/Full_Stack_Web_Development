<!-- 
In tables, semantics means the data relationships and meaning 
are explicitly encoded in the markup—not just visually arranged.

For HTML tables, semantic structure helps -
=> screen readers understand relationships,
=> browsers interpret data correctly,
=> search engines parse content,
=> developers maintain accessibility.

Example of a semantic table -
<table>
  <caption>Monthly Sales</caption>

  <thead>
    <tr>
      <th scope="col">Month</th>
      <th scope="col">Revenue</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <th scope="row">January</th>
      <td>$10,000</td>
    </tr>
    <tr>
      <th scope="row">February</th>
      <td>$12,000</td>
    </tr>
  </tbody>
</table>

Key semantic elements -
Element	        Meaning
<table>	    Declares tabular data
<caption>	  Gives the table a title
<thead>	    Groups header rows
<tbody>	    Groups body rows
<th>	      Header cell
scope	      Defines what headers apply to
<td>	      Standard data cell
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables In HTML</title>
</head>
<body>
   <table border = "3">
        <caption>Food Menu</caption>
        <!-- Table header -->
        <thead>
          <tr>
              <th>Item</th>
              <th>Price</th>
          </tr>
        </thead>

        <!-- Table body -->
        <tbody>
          <tr>
              <td>Frooti</td>
              <td>10</td>
          </tr>

          <tr>
              <td>Samosa</td>
              <td>12</td>
          </tr>

          <tr>
              <td>Chips</td>
              <td>20</td>
          </tr>
        </tbody>
   </table>
</body>
</html>
