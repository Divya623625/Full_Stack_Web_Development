<!-- 
<hr> stands for Horizontal Rule in HTML.
It is used to create a horizontal line on the webpage.

Example -
<h1>Hello</h1>
<hr>
<p>This is a paragraph</p>

Output -
A line appears between the heading and paragraph.

Uses of <hr>
Separates sections
Creates a visible line
Improves webpage structure
Important Point

<hr> is an empty/self-closing tag.
It does not need a closing tag.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <h1>This is heading 1</h1>
    <hr>
    <p>This is a paragraph</p>
    <hr>
    <h2>This is heading 2</h2>
</body>
</html>
