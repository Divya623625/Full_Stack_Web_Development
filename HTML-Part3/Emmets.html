<!-- Emmet in HTML
Emmet is a shortcut tool that helps you write HTML and CSS code very fast.
You type short forms → Emmet automatically creates full code.

Example - 1
Write:
!
Press -
Tab
Emmet creates -
<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
</body>
</html>

Example 2
Write -
h1
Press Tab
Output -
<h1></h1>

Example 3
Write -
ul>li*3
Press Tab
Output -
<ul>
  <li></li>
  <li></li>
  <li></li>
</ul>

Common Emmet Shortcuts
Emmet	Output
!	      HTML boilerplate
h1	      <h1></h1>
p	      <p></p>
a	      <a href=""></a>
ul>li*5	  5 list items
div	      <div> </div>
nav>ul>li nested structure
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmets</title>
</head>
<body>
    <!-- main > p > ul > li -->
    <main>
        <p>
            <ul>
                <li></li>
            </ul>
        </p>
    </main>
    <!-- p > div -->
     <p>
        <div></div>
     </p>
    <!-- div+p+img -->
    <div></div>
    <p></p>
    <img src="" alt="">
    <!-- ul>li*5 -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>
