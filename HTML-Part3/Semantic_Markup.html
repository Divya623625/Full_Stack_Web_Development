<!-- It is a markup that relates to the meaning of content
Semantic markup (HTML) means using HTML tags that clearly describe the meaning of content, not just how it looks.

Simple idea -
Instead of using only <div> and <span> (which don’t tell meaning), 
we use meaningful tags like -
<header> → top part of page
<nav> → navigation links
<main> → main content
<section> → section of content
<article> → independent content (like blog post)
<footer> → bottom part of page

Example -
Non-semantic -
<div class="top">My Website</div>
<div class="menu">Home About Contact</div>

Semantic -
<header>My Website</header>
<nav>Home About Contact</nav>

Why it is used?
Easier to understand code
Better SEO (Google understands page better)
Helps screen readers (accessibility)
Clean and organized structure
->
