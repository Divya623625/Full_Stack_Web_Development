<!-- 
In HTML, elements are broadly divided into inline elements and 
block-level elements based on how they behave in a webpage layout.

🔷 Block-Level Elements
Block elements take up the full width available and always start on a new line.

Key Features -
Start on a new line
Occupy full width of their container
Can contain both inline and other block elements

Common Examples -
<div>
<p>
<h1> to <h6>
<ul>, <ol>, <li>
<section>, <article>

Example - 
<p>This is a paragraph.</p>
<p>This is another paragraph.</p>
👉 Each <p> appears on a new line.

🔶 Inline Elements -
Inline elements only take up as much width as necessary and do not start on a new line.

Key Features -
Stay within the same line
Only take required width
Usually used for small pieces of content

Common Examples -
<span>
<a>
<strong>
<em>
<img>

Example -
<p>This is <strong>important</strong> text.</p>
👉 <strong> stays within the line.

Am I Inline or Block ?
. Heading Element - block
. Paragraph Element - block
. Anchor Tag - inline
. Image Element 
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Vs Block</title>
</head>
<body>
    <h1>Hello World</h1>
    <h1>Divya P</h1>
    <p>Heading Element is an block element</p>

    <a href = "https://www.google.com">Google Me</a>
    <a href = "https://www.facebook.com">Facebook Me</a>
    <a href = "https://www.youtube.com">Youtube Me</a>
    <p>Anchor tag is an inline element</p>

    <p>Hello World</p>
    <p>Divya P</p>
    <p>Paragraph is a block element</p>

    This is orange.<img src = "https://www.bing.com/th/id/OIP.xgATxwHFYgnaZVVli5PyuwHaIR?w=193&h=216&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=3.1&rm=2"/>
    This is apple.<img src = "https://media.istockphoto.com/id/925389178/photo/red-apple-fruit-with-green-leaf-isolated-on-white.jpg?s=612x612&w=0&k=20&c=_8d-RRR3BX36MwIOBZuN-bV-wp02C0WNCEo7fp0hqhA="/>
    <p>image is an inline element</p>

</body>
</html>
