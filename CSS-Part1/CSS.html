<!-- 
CSS stands for Cascading Style Sheets. It is a language used to control 
the appearance and layout of web pages.

=> HTML provides the structure (headings, paragraphs, buttons, etc.).
=> CSS provides the styling (colors, fonts, spacing, positioning, animations, etc.).
Example
HTML:
<h1>Hello, World!</h1>

CSS:
h1 {
  color: blue;
  font-size: 36px;
  text-align: center;
}

Result:
The heading text appears blue.
The font size is 36 pixels.
The text is centered.

What CSS Can Do
Change colors and backgrounds
Set fonts and text styles
Control spacing and alignment
Create responsive designs for phones and desktops
Add animations and transitions
Design page layouts with Flexbox and Grid

Why "Cascading"?
"Cascading" means that multiple style rules can apply to the same element, 
and CSS follows a set of priorities to determine which rule wins.

Simple Analogy
Think of a website like a house:
HTML = the structure (walls, doors, rooms)
CSS = the paint, decorations, and furniture
JavaScript = the electrical systems and interactive features

If you're learning web development, CSS is one of the three core 
technologies alongside HTML and JavaScript.
-->
