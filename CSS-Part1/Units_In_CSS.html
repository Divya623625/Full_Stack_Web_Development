<!-- Font Size Units in CSS
The font-size property is used to change the size of text.
1. Pixels (px)
Fixed size.
p {
    font-size: 20px;
}

2. Percentage (%)
Relative to the parent element's size.
p {
    font-size: 120%;
}

3. em
Relative to the parent element's font size.
p {
    font-size: 1.5em;
}

4. rem
Relative to the root (html) font size.
p {
    font-size: 2rem;
}

5. vw (Viewport Width)
Relative to browser width.
h1 {
    font-size: 5vw;
}

6. vh (Viewport Height)
Relative to browser height.
h1 {
    font-size: 5vh;
}

Quick Notes
Unit	Meaning
px	    Fixed size
%	    Relative to parent
em	    Relative to parent font size
rem	    Relative to root font size
vw	    Relative to viewport width
vh	    Relative to viewport height
Most commonly used units: px, em, and rem. 

Pixels (px) in CSS
Pixel (px) is a fixed unit of measurement used in CSS.
It is commonly used to set:
Font size
Width
Height
Margin
Padding
Example
h1 {
    font-size: 30px;
}
Here, the text size of the <h1> element will be 30 pixels.

Another Example
div {
    width: 200px;
    height: 100px;
}

Here:
Width = 200 pixels
Height = 100 pixels
Key Point
px = Fixed size
Easy to use and understand
Does not automatically adjust based on parent element size

Syntax:
property: valuepx;

Example:
font-size: 20px;-->
