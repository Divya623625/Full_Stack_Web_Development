<!-- 
Named Colors in CSS
Named colors are predefined color names that CSS understands directly.

Syntax-
h1 {
    color: red;
}

Examples of Named Colors-
red
blue
green
yellow
black
white
gray
orange
pink
purple
brown

Example-
<!DOCTYPE html>
<html>
<head>
<style>
h1 {
    color: blue;
}
p {
    color: green;
}
</style>
</head>
<body>
    <h1>Hello World</h1>
    <p>This is a paragraph.</p>
</body>
</html>

Definition-
Named colors are colors specified using predefined color names instead of 
color codes. CSS supports about 140 standard color names. -->
