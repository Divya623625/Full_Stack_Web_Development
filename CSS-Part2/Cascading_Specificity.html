<!-- Cascading in CSS means deciding which style will be applied when multiple CSS rules target the same element.

Example
<p>Hello</p>
p {
  color: blue;
}

p {
  color: red;
}

Output: Red text

Why? Because the second rule comes later, so it overrides the first one.

Priority Order
Inline CSS (highest)
Internal CSS
External CSS
Browser default style (lowest)

Simple definition:
Cascading = the process CSS uses to choose the final style when multiple styles apply to the same element. -->
