<!-- CSS Selectors
CSS selectors are used to select HTML elements that you want to style.
1. Universal Selector (*)
Selects all elements.
* {
  margin: 0;
  padding: 0;
}
2. Element Selector
Selects all elements of a specific type.
p {
  color: blue;
}
3. Class Selector (.)
Selects elements with a specific class.
.highlight {
  background-color: yellow;
}
<p class="highlight">Hello</p>
4. ID Selector (#)
Selects an element with a specific ID.
#header {
  color: red;
}
<h1 id="header">Welcome</h1>
5. Group Selector (,)
Applies the same style to multiple elements.
h1, h2, p {
  font-family: Arial;
}
6. Descendant Selector (space)
Selects elements inside another element.
div p {
  color: green;
}
7. Child Selector (>)
Selects direct child elements.
div > p {
  color: orange;
}
8. Adjacent Sibling Selector (+)
Selects the element immediately after another element.
h1 + p {
  color: purple;
}
9. General Sibling Selector (~)
Selects all sibling elements after a specified element.
h1 ~ p {
  color: brown;
}
10. Attribute Selector ([])
Selects elements based on attributes.
input[type="text"] {
  border: 1px solid black;
}
11. Pseudo-class Selector (:)
Selects elements in a specific state.
a:hover {
  color: red;
}

Common pseudo-classes:

:hover
:focus
:first-child
:last-child
:nth-child()
12. Pseudo-element Selector (::)

Selects part of an element.

p::first-letter {
  font-size: 30px;
}

Common pseudo-elements:

::before
::after
::first-letter
::first-line
Example
<p id="para1" class="text">Hello CSS</p>
p { color: blue; }        /* Element selector */
#para1 { font-size: 20px; } /* ID selector */
.text { font-weight: bold; } /* Class selector */

Summary Table

Selector	Example	    Description
    *	            *	    All elements
    Element	        p	    All <p> elements
    Class	        .box	Elements with class box
    ID	            #main	Element with ID main
    Group	        h1, p	Multiple elements
    Descendant	    div p	<p> inside <div>
    Child	        div > p	Direct child <p>
    Adjacent Sibling	h1 + p	Next <p> after <h1>
    General Sibling	h1 ~ p	All following <p> siblings
    Attribute	        [type="text"]	Elements with attribute
    Pseudo-class	    a:hover	Element in a state
    Pseudo-element	    p::first-letter	Part of an element -->
