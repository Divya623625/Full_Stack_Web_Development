<!-- Pseudo-class is used to style an element in a special state.

Syntax
selector:pseudo-class {
    property: value;
}
Common Pseudo-classes
1. :hover

When the mouse pointer is over an element.

button:hover {
    background-color: yellow;
}
2. :active

When an element is being clicked.

button:active {
    background-color: red;
}
3. :focus

When an input field is selected.

input:focus {
    background-color: lightblue;
}
4. :checked

For selected checkboxes or radio buttons.

input:checked {
    width: 20px;
}
5. :nth-of-type(n)

Selects a specific numbered element.

p:nth-of-type(2) {
    color: green;
}
Example
a:hover {
    color: red;
}

When you move the mouse over a link, its color changes to red.
Pseudo-class = styles an element based on its state (hover, click, focus, etc.). -->
